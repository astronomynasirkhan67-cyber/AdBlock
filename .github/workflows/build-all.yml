name: ULTRON AI — Build APK and Windows EXE

on:
  workflow_dispatch:
    inputs:
      llama_tag:
        description: "Optional llama.cpp release tag for the brain engine (empty = latest)"
        required: false
        default: ""
  push:
    branches: [ main, master ]

permissions:
  contents: write

concurrency:
  group: ultron-build
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  # Creates the "latest" release once, so APK and EXE jobs can upload in parallel
  # without racing each other (and without needing upload-artifact storage).
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Move "latest" tag to this commit and ensure release exists
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag -f latest "${GITHUB_SHA}"
          git push -f origin refs/tags/latest
          if ! gh release view latest --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create latest --repo "${GITHUB_REPOSITORY}" \
              --prerelease --title "ULTRON AI — Latest Builds" \
              --notes "Automatic builds: ULTRON-AI.apk (Android) and ULTRON-AI.exe (Windows)."
          fi

  android-apk:
    name: Build Android APK
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # NOTE: "yes | sdkmanager" returns exit code 141 under GitHub's default
      # "bash -e -o pipefail", which was killing the old build. Handled here.
      - name: Accept Android SDK licences
        shell: bash
        run: |
          set +o pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          echo "Licences step finished"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set +o pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null || true
          ls "${ANDROID_HOME}/platforms" "${ANDROID_HOME}/build-tools"

      # The brain engine: llama.cpp's llama-server, cross-compiled for Android arm64.
      # It is packaged as libllama_server.so and started by the app on 127.0.0.1.
      - name: Build brain engine (llama.cpp server, Android arm64)
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.llama_tag }}"
          if [ -z "$TAG" ]; then
            TAG="$(gh api repos/ggml-org/llama.cpp/releases/latest --jq .tag_name)"
          fi
          echo "llama.cpp tag: $TAG"
          git clone --depth 1 --branch "$TAG" https://github.com/ggml-org/llama.cpp.git llama.cpp
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-${ANDROID_NDK_HOME:-}}}"
          echo "NDK: $NDK"
          mkdir -p app/src/main/jniLibs/arm64-v8a

          # Builds llama-server for one CPU level and copies it into the APK as a .so file.
          build_variant() {
            local DIR="$1" ARCH="$2" OUT="$3"
            cmake -S llama.cpp -B "$DIR" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DANDROID_STL=c++_static \
              -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
              -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DGGML_LLAMAFILE=OFF \
              -DGGML_CPU_ARM_ARCH="$ARCH" \
              -DCMAKE_C_FLAGS="-march=$ARCH" -DCMAKE_CXX_FLAGS="-march=$ARCH" \
              -DCMAKE_EXE_LINKER_FLAGS="-Wl,-z,max-page-size=16384" \
              -DLLAMA_CURL=OFF -DLLAMA_OPENSSL=OFF \
              -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF -DLLAMA_BUILD_WEBUI=OFF \
              -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF
            if ! cmake --build "$DIR" --config Release -j"$(nproc)" --target llama-server; then
              echo "---- first build failed; retrying with web-UI validation relaxed (we do not ship the web UI)"
              sed -i '125,150s/FATAL_ERROR/WARNING/' llama.cpp/scripts/ui-assets.cmake || true
              if ! cmake --build "$DIR" --config Release -j"$(nproc)" --target llama-server; then
                echo "---- llama-server target failed; available targets:"
                cmake --build "$DIR" --target help | grep -i -E "server|llama" || true
                exit 1
              fi
            fi
            local BIN
            BIN="$(find "$DIR" -name llama-server -type f | head -n 1)"
            echo "Engine binary ($ARCH): $BIN"
            cp "$BIN" "app/src/main/jniLibs/arm64-v8a/$OUT"
            "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" "app/src/main/jniLibs/arm64-v8a/$OUT" || true
          }

          # Safe baseline for every arm64 phone, plus a faster build for phones with dot-product support.
          # The app tries the fast one first and falls back automatically.
          build_variant build-android-base "armv8-a" libllama_server.so
          build_variant build-android-dot "armv8.2-a+dotprod" libllama_server_dot.so
          ls -la app/src/main/jniLibs/arm64-v8a

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Rename APK
        shell: bash
        run: cp app/build/outputs/apk/debug/app-debug.apk ULTRON-AI.apk

      - name: Upload APK to release
        shell: bash
        run: gh release upload latest ULTRON-AI.apk --clobber --repo "${GITHUB_REPOSITORY}"

  windows-exe:
    name: Build Windows EXE
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Check Python syntax
        run: python -m py_compile desktop/ultron_desktop.py

      # The brain engine: llama.cpp's llama-server.exe, bundled inside ULTRON-AI.exe.
      - name: Build brain engine (llama.cpp server, Windows x64)
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.llama_tag }}"
          if [ -z "$TAG" ]; then
            TAG="$(gh api repos/ggml-org/llama.cpp/releases/latest --jq .tag_name)"
          fi
          echo "llama.cpp tag: $TAG"
          git clone --depth 1 --branch "$TAG" https://github.com/ggml-org/llama.cpp.git llama.cpp
          cmake -S llama.cpp -B build-win -A x64 \
            -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF \
            -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_OPENMP=OFF \
            -DLLAMA_CURL=OFF -DLLAMA_OPENSSL=OFF \
            -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF -DLLAMA_BUILD_WEBUI=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build build-win --config Release --target llama-server -j 4 || {
            echo "---- first build failed; retrying with web-UI validation relaxed (we do not ship the web UI)"
            sed -i '125,150s/FATAL_ERROR/WARNING/' llama.cpp/scripts/ui-assets.cmake || true
            if cmake --build build-win --config Release --target llama-server -j 4; then
              echo "retry succeeded"
            else
            echo "---- llama-server target failed; available targets:"
            cmake --build build-win --target help | grep -i -E "server|llama" || true
              exit 1
            fi
          }
          BIN="$(find build-win -name llama-server.exe -type f | head -n 1)"
          echo "Engine binary: $BIN"
          cp "$BIN" llama-server.exe
          ls -la llama-server.exe

      - name: Build ULTRON desktop executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name ULTRON-AI `
            --icon desktop/ultron.ico `
            --add-binary "llama-server.exe;." `
            --add-data "desktop/ultron.ico;." `
            desktop/ultron_desktop.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload EXE to release
        shell: bash
        run: gh release upload latest dist/ULTRON-AI.exe --clobber --repo "${GITHUB_REPOSITORY}"
